[package]
name = "pinshot-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "PinShot desktop shell (Tauri)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pinshot-core = { path = "../crates/pinshot-core" }
pinshot-app = { path = "../crates/pinshot-app" }
pinshot-capture = { path = "../crates/pinshot-capture" }
pinshot-store = { version = "0.1.0", path = "../crates/pinshot-store" }
pinshot-ocr = { version = "0.1.0", path = "../crates/pinshot-ocr" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# Shipping profile: symbols are useless in a bundled app and cost tens of megabytes.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# Debug artifacts were the biggest disk cost: dependencies carry full DWARF that is
# never used (we debug our own crates, not tauri/objc2/rusqlite), and incremental data
# grows with every edit.
#   line-tables-only → backtraces keep file:line, lldb still resolves frames
#   deps get no debug info at all
#   incremental off  → a few seconds slower rebuilds, several GB saved
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
