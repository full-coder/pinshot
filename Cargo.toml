[workspace]
resolver = "2"
members = [
    "crates/pinshot-core",
    "crates/pinshot-capture",
    "crates/pinshot-app",
    "crates/pinshot-cli",
    "crates/pinshot-store",
    "crates/pinshot-ocr",
    "crates/pinshot-stitch",
]
# The Tauri shell is built separately: keeping it out of the workspace means
# `cargo test` does not pay for a Tauri rebuild.
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

# Debug artifacts were the biggest disk cost: dependencies carry full DWARF that is
# never used (we debug our own crates, not tauri/objc2/rusqlite), and incremental data
# grows with every edit.
#   line-tables-only → backtraces keep file:line, lldb still resolves frames
#   deps get no debug info at all
#   incremental off  → a few seconds slower rebuilds, several GB saved
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
