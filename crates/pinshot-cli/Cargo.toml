[package]
name = "pinshot-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
pinshot-app = { version = "0.1.0", path = "../pinshot-app" }
pinshot-capture = { version = "0.1.0", path = "../pinshot-capture" }
pinshot-core = { version = "0.1.0", path = "../pinshot-core" }
pinshot-ocr = { version = "0.1.0", path = "../pinshot-ocr" }
pinshot-stitch = { version = "0.1.0", path = "../pinshot-stitch" }
pinshot-store = { version = "0.1.0", path = "../pinshot-store" }
serde_json.workspace = true

[[bin]]
name = "pinshot"
path = "src/main.rs"

[dev-dependencies]
image = "0.25.10"
